<!doctype html><html lang="ca"><head><meta charset="utf-8"><title>SardIA</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#061523;--bg2:#0A2033;--text:#E8F1F7;--mut:#8FA9BB;--cyan:#2ED3F2;--amber:#F0B44E;--line:rgba(46,211,242,.22)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:var(--bg);color:var(--text);font-family:"Schibsted Grotesk",sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(700px 520px at 85% 8%,rgba(46,211,242,.20),transparent 70%),radial-gradient(600px 500px at 0% 100%,rgba(240,180,78,.12),transparent 70%)}
.ray{position:absolute;right:-120px;top:150px;width:900px;opacity:.10}
.wrap{position:absolute;inset:0;padding:72px 80px 72px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{width:340px}
.mono{font-family:"JetBrains Mono",monospace;font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{font-size:96px;line-height:1.02;font-weight:700;letter-spacing:-.03em;margin-top:80px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--amber),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:38px;color:var(--mut);margin-top:26px}
.where{margin-top:56px;border-top:1px solid var(--line);padding-top:30px;display:flex;justify-content:space-between;align-items:flex-end}
.place{font-size:96px;font-weight:700;letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:18px}
.place svg{width:54px;height:54px;stroke:var(--amber);fill:none;stroke-width:3}
.reg{font-size:30px;line-height:1.3;text-align:right;color:var(--text)}
.coord{font-family:"JetBrains Mono",monospace;font-size:20px;color:var(--mut);margin-top:14px;letter-spacing:.06em}
.lab{margin-bottom:18px}
.serv{margin-top:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.card{background:linear-gradient(180deg,var(--bg2),#08192A);border:1px solid var(--line);border-radius:26px;padding:0 28px;height:150px;display:flex;align-items:center;gap:22px;font-size:33px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.ic{width:58px;height:58px;flex:none;stroke:var(--cyan);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card:nth-child(even) .ic{stroke:var(--amber)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:30px;color:var(--mut)}
.pin{color:var(--amber);font-size:14px;vertical-align:middle}.foot b{color:var(--text);font-weight:600;font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.04em}
</style></head><body><div class="glow"></div><img class="ray" src="logo-mark.png">
<div class="wrap">
 <div class="top"><img src="logo-wordmark.png"><span class="mono">Consultoria d’IA i dades</span></div>
 <h1>La IA que resol el dia a dia del teu <em>negoci.</em></h1>
 <p class="sub">Per a pimes i autònoms.</p>
 <div class="serv"><div class="mono">QUÈ FEM</div><div class="grid"><div class="card"><svg viewBox="0 0 48 48" class="ic"><circle cx="12" cy="12" r="5"/><circle cx="36" cy="36" r="5"/><path d="M17 12h10a6 6 0 0 1 6 6v13"/><path d="M29 27l4 4 4-4"/></svg><span>Automatització</span></div><div class="card"><svg viewBox="0 0 48 48" class="ic"><path d="M8 40V24M20 40V12M32 40V28M44 40V18"/><path d="M4 40h44"/></svg><span>Quadres de dades</span></div><div class="card"><svg viewBox="0 0 48 48" class="ic"><circle cx="18" cy="16" r="6"/><path d="M6 40c0-8 5-13 12-13s12 5 12 13"/><circle cx="35" cy="19" r="4"/><path d="M34 28c6 0 10 4 10 11"/></svg><span>CRM i ERP a mida</span></div><div class="card"><svg viewBox="0 0 48 48" class="ic"><path d="M5 36l12-12 8 7 16-19"/><path d="M32 12h9v9"/></svg><span>Previsió de vendes</span></div><div class="card"><svg viewBox="0 0 48 48" class="ic"><path d="M24 8 4 18l20 10 20-10z"/><path d="M12 24v10c0 4 6 8 12 8s12-4 12-8V24"/><path d="M44 18v14"/></svg><span>Formació en IA</span></div><div class="card"><svg viewBox="0 0 48 48" class="ic"><rect x="5" y="9" width="38" height="30" rx="4"/><path d="M5 18h38"/><circle cx="11" cy="13.5" r="1"/><circle cx="16" cy="13.5" r="1"/></svg><span>Pàgines web</span></div></div></div>
 <div class="foot"><span>Comença petit. Un sol procés.</span><b><span class="pin">&#9679;</span> Valls · sardia.es</b></div>
</div></body></html>
